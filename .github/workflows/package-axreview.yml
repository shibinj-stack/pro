name: Package AxReview submission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-axreview.yml'
      - '.github/workflows/ci.yml'
      - 'server/**'
      - 'web/**'
      - 'render.yaml'
      - 'docs/**'
      - 'evidence/**'
      - 'README.md'
      - 'package.json'
      - 'MEAN/**'
  workflow_dispatch:
  workflow_run:
    workflows: ["ClinicDesk deployment checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out submission repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create submission notes and archive
        shell: bash
        run: |
          set -euo pipefail
          TASK_DIR="$GITHUB_WORKSPACE/MEAN/module-22-dockerization-production-cloud/task-03-deploy-to-the-cloud-and-commit-the"
          HEALTH_FILE="$TASK_DIR/evidence/health-check.txt"
          HEALTH_BODY="$(sed -n '/^Exact response body:/{n;p;}' "$HEALTH_FILE" | head -n 1)"
          HEALTH_RESULT="$(sed -n 's/^Verification result: //p' "$HEALTH_FILE" | head -n 1)"
          HTTP_STATUS="$(sed -n 's/^HTTP status: //p' "$HEALTH_FILE" | head -n 1)"
          DB_STATE="$(printf '%s' "$HEALTH_BODY" | jq -r '.database // "NOT_RETURNED"' 2>/dev/null || echo NOT_RETURNED)"
          DB_URI_CONFIGURED="$(printf '%s' "$HEALTH_BODY" | jq -r 'if has("databaseUriConfigured") then .databaseUriConfigured else "NOT_RETURNED" end' 2>/dev/null || echo NOT_RETURNED)"

          cat > AXREVIEW-SUBMISSION-NOTES.md <<EOF
          # AxReview submission notes

          Repository: https://github.com/shibinj-stack/pro
          Branch: main
          Packaged commit: $GITHUB_SHA
          Generated at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          GitHub Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Render service URL: https://clinicdesk-api-demo.onrender.com
          Render service ID: srv-db698s8473hc73dkp5vg

          ## Included
          - API source and HTTP endpoint tests
          - Dockerfile and Docker ignore files
          - Render Blueprint configuration
          - GitHub Actions workflow for tests, image build, live health verification, and evidence generation
          - Deployment instructions
          - Genuine live health-check response and deployment record in evidence/health-check.txt and evidence/deployment.md
          - Safe host/provider environment record in evidence/host-environment.md
          - Required AxReview task-path log: MEAN/module-22-dockerization-production-cloud/task-03-deploy-to-the-cloud-and-commit-the/docs/deployment.md
          - The task folder also contains deployment-run.log, capture-evidence.yml, source files, tests, Render config, image-push evidence, and scripts.
          - Task-folder step-by-step deployment log and evidence under MEAN/module-22-dockerization-production-cloud/task-03-deploy-to-the-cloud-and-commit-the/

          ## Last verified results at packaging time
          - API tests: 3 passed, 0 failed
          - Docker image build: passed
          - Latest captured /health HTTP status: $HTTP_STATUS
          - Actual full-verification result: $HEALTH_RESULT
          - Actual database state: $DB_STATE
          - MongoDB URI configured flag from payload: $DB_URI_CONFIGURED
          - A full deployment pass requires database=connected; HTTP 200 alone does not prove MongoDB connectivity.

          ## Scope warning
          This repository is a minimal deployment demo, not the user's original full ClinicDesk MEAN stack app. Submit it only if this demo is the project intended for this AxReview task. Do not present it as the original full application.

          ## AxReview
          A successful CI run and health check are supporting evidence, not a guarantee of AxReview approval. Review any additional evaluator feedback and keep all deployment facts genuine.
          EOF

          cat > "$TASK_DIR/SUBMISSION-NOTES.md" <<EOF
          # Week 22 Task 03 — AxReview submission

          Packaged commit: $GITHUB_SHA
          Packaged at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Package workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Render service URL: https://clinicdesk-api-demo.onrender.com
          Render service ID: srv-db698s8473hc73dkp5vg

          The archive root is the task folder itself. The step-by-step log is directly at docs/deployment.md, deployment-run.log is at the task root, and the evidence files are directly under evidence/.

          Latest captured live health evidence:
          - Verification result: $HEALTH_RESULT
          - HTTP status: $HTTP_STATUS
          - MongoDB state: $DB_STATE
          - MongoDB URI configured flag: $DB_URI_CONFIGURED

          A complete deployment pass requires database=connected. HTTP 200 with database=not_configured is only an API smoke test, not proof of a cloud database connection. The workflow records the actual outcome and must not be represented as a full pass until MongoDB connects.
          EOF

          ZIP_PATH="$RUNNER_TEMP/clinicdesk-week22-task03-axreview-corrected.zip"
          cd "$TASK_DIR"
          zip -qr "$ZIP_PATH" . -x './.git/*' '*/.git/*' './node_modules/*' '*/node_modules/*'
          echo "Created $ZIP_PATH with task-folder contents at archive root"
          unzip -l "$ZIP_PATH" | tail -n 40
          unzip -Z1 "$ZIP_PATH" | grep -qx 'docs/deployment.md'
          unzip -Z1 "$ZIP_PATH" | grep -qx 'deployment.md'
          unzip -Z1 "$ZIP_PATH" | grep -qx 'evidence/health-check.txt'
          if unzip -Z1 "$ZIP_PATH" | grep -q '^MEAN/'; then
            echo "Unexpected duplicate MEAN/task-folder nesting in submission ZIP"
            exit 1
          fi

      - name: Upload complete submission ZIP
        uses: actions/upload-artifact@v4
        with:
          name: clinicdesk-week22-task03-axreview-submission
          path: ${{ runner.temp }}/clinicdesk-week22-task03-axreview-corrected.zip
          if-no-files-found: error
          retention-days: 30
