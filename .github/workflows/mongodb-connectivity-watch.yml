name: MongoDB connectivity watch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mongodb-connectivity-watch.yml'
      - 'docs/mongodb-setup.md'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-live-database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out evidence
        uses: actions/checkout@v4

      - name: Probe live Render MongoDB connectivity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BACKEND_URL: https://clinicdesk-api-demo.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          BODY="$RUNNER_TEMP/current-health.json"
          STATUS="$(curl --location --silent --show-error --output "$BODY" --write-out '%{http_code}' --max-time 30 "${BACKEND_URL%/}/health" || true)"
          DB_STATE="$(jq -r '.database // "NOT_RETURNED"' "$BODY" 2>/dev/null || echo NOT_RETURNED)"
          DB_URI_CONFIGURED="$(jq -r 'if has("databaseUriConfigured") then .databaseUriConfigured else "NOT_RETURNED" end' "$BODY" 2>/dev/null || echo NOT_RETURNED)"
          ALLOW_NO_DATABASE="$(jq -r 'if has("allowNoDatabase") then .allowNoDatabase else "NOT_RETURNED" end' "$BODY" 2>/dev/null || echo NOT_RETURNED)"
          LIVE_COMMIT="$(jq -r '.render.gitCommit // empty' "$BODY" 2>/dev/null || true)"

          {
            echo "## Automated MongoDB connectivity watch"
            echo "- Checked at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Live health endpoint: ${BACKEND_URL%/}/health"
            echo "- HTTP status: $STATUS"
            echo "- Database state: $DB_STATE"
            echo "- MongoDB URI configured flag: $DB_URI_CONFIGURED"
            echo "- ALLOW_NO_DATABASE: $ALLOW_NO_DATABASE"
            echo "- Render deployed commit: ${LIVE_COMMIT:-NOT_RETURNED}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" != "200" ] || [ "$DB_STATE" != "connected" ] || [ "$DB_URI_CONFIGURED" != "true" ] || [ "$ALLOW_NO_DATABASE" != "false" ]; then
            {
              echo
              echo "Full verification is still waiting for a real MongoDB connection."
              echo "Configure MONGODB_URI securely in Render and set ALLOW_NO_DATABASE=false. No success is recorded for a database-free response."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          OLD_BODY="$(sed -n '/^Exact response body:/{n;p;}' evidence/health-check.txt 2>/dev/null | head -n 1 || true)"
          OLD_DB="$(printf '%s' "$OLD_BODY" | jq -r '.database // "NOT_RETURNED"' 2>/dev/null || echo NOT_RETURNED)"
          OLD_COMMIT="$(printf '%s' "$OLD_BODY" | jq -r '.render.gitCommit // empty' 2>/dev/null || true)"

          if [ "$OLD_DB" = "connected" ] && [ -n "$LIVE_COMMIT" ] && [ "$OLD_COMMIT" = "$LIVE_COMMIT" ]; then
            echo "The current deployed commit already has connected-database evidence; no new full build is needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "MongoDB is connected. Dispatching the full test/build/deployment evidence workflow." >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Full verification was queued. Check the ClinicDesk deployment checks workflow for the final result." >> "$GITHUB_STEP_SUMMARY"
