name: ClinicDesk deployment checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Live backend base URL (e.g. https://service.onrender.com)'
        required: false
        type: string
      deployment_id:
        description: 'Actual Render deployment ID or deployed commit SHA'
        required: false
        type: string

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API dependencies
        working-directory: server
        run: npm install

      - name: Run API tests
        working-directory: server
        run: npm test

      - name: Build Docker image
        run: docker build -f server/Dockerfile -t clinicdesk-api:${{ github.sha }} server

      - name: Check live deployment and record actual response
        if: github.event_name == 'workflow_dispatch' && inputs.backend_url != ''
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          URL="${BACKEND_URL%/}/health"
          STATUS="$(curl --silent --show-error --output /tmp/health-body.json --write-out '%{http_code}' --max-time 30 "$URL")"
          {
            echo "Health-check evidence generated by GitHub Actions"
            echo "Backend URL: ${BACKEND_URL}"
            echo "Health path: /health"
            echo "Checked at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Deployment ID or commit SHA supplied: ${DEPLOYMENT_ID:-NOT_SUPPLIED}"
            echo "HTTP status: ${STATUS}"
            echo "Response body:"
            cat /tmp/health-body.json
            echo
          } > evidence/health-check.txt
          test "$STATUS" -ge 200 && test "$STATUS" -lt 300

      - name: Commit health evidence
        if: github.event_name == 'workflow_dispatch' && inputs.backend_url != ''
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: record live deployment health check'
          file_pattern: evidence/health-check.txt
