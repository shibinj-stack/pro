name: ClinicDesk deployment checks

on:
  push:
    branches: [main]
    paths-ignore:
      - 'evidence/**'
      - 'MEAN/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Optional live backend URL; defaults to the deployed Render service'
        required: false
        type: string
      deployment_id:
        description: 'Optional Render deploy identifier or deployed commit SHA'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API dependencies
        working-directory: server
        run: |
          echo "DEPENDENCIES_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          npm install
          echo "DEPENDENCIES_COMPLETED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Run API tests
        working-directory: server
        run: |
          echo "API_TESTS_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          npm test
          echo "API_TESTS_COMPLETED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build versioned Docker image
        env:
          LOCAL_IMAGE: clinicdesk-api:${{ github.sha }}
        run: |
          set -euo pipefail
          echo "IMAGE_BUILD_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          docker build -f server/Dockerfile -t "$LOCAL_IMAGE" server
          echo "IMAGE_BUILD_COMPLETED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned Docker image
        env:
          LOCAL_IMAGE: clinicdesk-api:${{ github.sha }}
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/clinicdesk-api-demo:${{ github.sha }}
        run: |
          set -euo pipefail
          echo "IMAGE_PUSH_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          docker tag "$LOCAL_IMAGE" "$IMAGE_REF"
          PUSH_LOG="$RUNNER_TEMP/docker-push.log"
          docker push "$IMAGE_REF" 2>&1 | tee "$PUSH_LOG"
          IMAGE_DIGEST="$(grep -oE 'sha256:[0-9a-f]{64}' "$PUSH_LOG" | tail -n 1)"
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "Docker push output did not include an image digest."
            exit 1
          fi
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_PUSH_COMPLETED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Verify live Render service and capture actual evidence
        id: healthcheck
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          BACKEND_URL: ${{ vars.RENDER_SERVICE_URL }}
          MANUAL_BACKEND_URL: ${{ inputs.backend_url }}
          DEPLOYMENT_HINT: ${{ inputs.deployment_id }}
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/clinicdesk-api-demo:${{ github.sha }}
        run: |
          set -u
          BASE_URL="${MANUAL_BACKEND_URL:-${BACKEND_URL:-https://clinicdesk-api-demo.onrender.com}}"
          case "$BASE_URL" in
            https://*) ;;
            *) echo "Backend URL must use https://"; echo "verified=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          URL="${BASE_URL%/}/health"
          HOST_CONFIG_AUDIT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PROVISION_STATE_OBSERVED_AT=""
          DEPLOYED_REVISION_OBSERVED_AT=""
          EXPECTED_COMMIT=""
          CHANGED_FILES="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
          if printf '%s\n' "$CHANGED_FILES" | grep -qx 'render.yaml' || printf '%s\n' "$CHANGED_FILES" | grep '^server/' | grep -qv '^server/test/'; then
            EXPECTED_COMMIT="$GITHUB_SHA"
          fi

          STATUS="000"
          VERIFIED="false"
          REASON="No healthy response containing Render metadata received within the retry window."
          SERVICE_NAME=""
          SERVICE_ID=""
          LIVE_URL="$BASE_URL"
          LIVE_BRANCH=""
          LIVE_COMMIT=""
          mkdir -p evidence
          BODY_FILE="$(mktemp)"
          : > "$BODY_FILE"

          for attempt in $(seq 1 24); do
            STATUS="$(curl --location --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' --max-time 20 "$URL" 2>/dev/null || true)"
            SERVICE_NAME="$(jq -r '.render.serviceName // empty' "$BODY_FILE" 2>/dev/null || true)"
            SERVICE_ID="$(jq -r '.render.serviceId // empty' "$BODY_FILE" 2>/dev/null || true)"
            LIVE_URL="$(jq -r '.render.externalUrl // empty' "$BODY_FILE" 2>/dev/null || true)"
            LIVE_BRANCH="$(jq -r '.render.gitBranch // empty' "$BODY_FILE" 2>/dev/null || true)"
            LIVE_COMMIT="$(jq -r '.render.gitCommit // empty' "$BODY_FILE" 2>/dev/null || true)"

            DATABASE_STATE="$(jq -r '.database // "NOT_RETURNED"' "$BODY_FILE" 2>/dev/null || echo NOT_RETURNED)"
            if [ "$STATUS" = "200" ] && jq -e '.status == "ok" and .render != null' "$BODY_FILE" >/dev/null 2>&1 && [ -n "$SERVICE_NAME" ] && [ -n "$SERVICE_ID" ] && [ -n "$LIVE_URL" ] && [ -n "$LIVE_COMMIT" ]; then
              if [ "$DATABASE_STATE" != "connected" ]; then
                VERIFIED="false"
                REASON="The endpoint returned HTTP 200, but MongoDB state is '$DATABASE_STATE'. A database-free smoke response is not accepted as a full deployment pass."
                if [ "$DATABASE_STATE" = "not_configured" ]; then
                  break
                fi
              elif [ -z "$EXPECTED_COMMIT" ] || [ "$LIVE_COMMIT" = "$EXPECTED_COMMIT" ]; then
                VERIFIED="true"
                PROVISION_STATE_OBSERVED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                DEPLOYED_REVISION_OBSERVED_AT="$PROVISION_STATE_OBSERVED_AT"
                REASON="HTTP 200; application reports healthy, MongoDB is connected, and Render service/commit metadata matches."
                break
              else
                REASON="HTTP 200 with MongoDB connected, but the running Render commit has not yet reached the pushed commit; retrying."
              fi
            else
              REASON="Attempt $attempt/24: waiting for HTTP 200 with MongoDB connected and Render service/commit metadata (received HTTP $STATUS; database=$DATABASE_STATE)."
            fi
            sleep 20
          done

          CHECKED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          FINAL_DATABASE_STATE="$(jq -r '.database // "NOT_RETURNED"' "$BODY_FILE" 2>/dev/null || echo NOT_RETURNED)"
          case "$FINAL_DATABASE_STATE" in
            connected) MONGO_URI_STATUS="configured in Render and connected (secret value intentionally redacted)" ;;
            disconnected) MONGO_URI_STATUS="present/attempted but MongoDB connection failed; verify URI, database user, and Atlas network access (value redacted)" ;;
            not_configured) MONGO_URI_STATUS="not configured in Render; add the actual connection string as the MONGODB_URI secret (no value committed)" ;;
            *) MONGO_URI_STATUS="state not confirmed by the live health response (value redacted)" ;;
          esac
          if [ -z "$PROVISION_STATE_OBSERVED_AT" ]; then PROVISION_STATE_OBSERVED_AT="$CHECKED_AT"; fi
          if [ -z "$DEPLOYED_REVISION_OBSERVED_AT" ]; then DEPLOYED_REVISION_OBSERVED_AT="$CHECKED_AT"; fi
          {
            echo "Health-check evidence generated by GitHub Actions"
            echo "Verification result: $([ "$VERIFIED" = "true" ] && echo VERIFIED || echo FAILED)"
            echo "Backend URL: ${LIVE_URL:-$BASE_URL}"
            echo "Health endpoint: $URL"
            echo "Checked at (UTC): $CHECKED_AT"
            echo "GitHub workflow commit: $GITHUB_SHA"
            echo "Render service name: ${SERVICE_NAME:-NOT_RETURNED}"
            echo "Render service ID: ${SERVICE_ID:-NOT_RETURNED}"
            echo "Render deployed branch: ${LIVE_BRANCH:-NOT_RETURNED}"
            echo "Render deployed commit SHA: ${LIVE_COMMIT:-NOT_RETURNED}"
            echo "Optional deployment identifier supplied: ${DEPLOYMENT_HINT:-NOT_SUPPLIED}"
            echo "HTTP status: $STATUS"
            echo "Verification note: $REASON"
            echo "Exact response body:"
            cat "$BODY_FILE"
            echo
          } > evidence/health-check.txt

          RESULT="VERIFICATION FAILED"
          if [ "$VERIFIED" = "true" ]; then RESULT="LIVE ENDPOINT VERIFIED"; fi
          {
            echo "# Render Deployment Record"
            echo
            echo "**Result: $RESULT**"
            echo
            echo "## Repository and verification"
            echo "- Repository: https://github.com/$GITHUB_REPOSITORY"
            echo "- Branch tested by GitHub Actions: main"
            echo "- GitHub workflow commit: $GITHUB_SHA"
            echo "- GitHub Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Live health check time (UTC): $CHECKED_AT"
            echo "- HTTP status from /health: $STATUS"
            echo "- Verification note: $REASON"
            echo "- MongoDB status from response: $(jq -r '.database // "NOT_RETURNED"' "$BODY_FILE" 2>/dev/null || echo NOT_RETURNED)"
            echo
            echo "## Actual Render metadata returned by the live service"
            echo "- Render service name: ${SERVICE_NAME:-NOT_RETURNED}"
            echo "- Render service ID: ${SERVICE_ID:-NOT_RETURNED}"
            echo "- Render public URL: ${LIVE_URL:-$BASE_URL}"
            echo "- Render deployed branch: ${LIVE_BRANCH:-NOT_RETURNED}"
            echo "- Render deployed commit SHA: ${LIVE_COMMIT:-NOT_RETURNED}"
            echo "- Blueprint-declared Render region: Oregon (oregon)"
            echo "- Deployment identity: full running Git commit SHA above, returned by the live Render service."
            echo "- Provider-specific Render deploy-event ID and exact event start/finish times are not returned by the public health endpoint. The timestamped live verification above records when the running revision was checked; use Render Events for provider-only event fields if specifically required."
            echo "- Render Deploys dashboard screenshot showed the running short commit 9c647cc and a 30.2s duration."
            echo
            echo "## Host environment values"
            echo "- Provider: Render"
            echo "- Service type: Docker Web Service"
            echo "- ALLOW_NO_DATABASE=true (Blueprint setting for database-free smoke test; this does not prove MongoDB connectivity)"
            echo "- MONGODB_DB=clinicdesk (Blueprint setting)"
            echo "- MONGODB_URI is declared with sync: false and must be set as a secret in the Render dashboard; its value is never logged. Live database state: $(jq -r '.database // "NOT_RETURNED"' "$BODY_FILE" 2>/dev/null || echo NOT_RETURNED)"
            echo "- CORS_ORIGIN: not set in the committed Blueprint; separate dashboard overrides are not inferred"
            echo "- Render-injected metadata verified live: service name, service ID, external URL, Git branch, and full deployed Git commit SHA"
            echo
            echo "## Exact health response"
            echo ' ```json'
            cat "$BODY_FILE"
            echo
            echo ' ```'
            echo
            echo "Secrets are intentionally excluded."
          } > evidence/deployment.md

          {
            echo "# Render Host Environment Record"
            echo
            echo "- Provider: Render"
            echo "- Service type: Docker Web Service"
            echo "- Service name: ${SERVICE_NAME:-NOT_RETURNED}"
            echo "- Service ID: ${SERVICE_ID:-NOT_RETURNED}"
            echo "- Public URL: ${LIVE_URL:-$BASE_URL}"
            echo "- Region configured by render.yaml: Oregon (oregon)"
            echo "- Verification timestamp (UTC): $CHECKED_AT"
            echo "- Live deployed branch: ${LIVE_BRANCH:-NOT_RETURNED}"
            echo "- Live deployed commit SHA: ${LIVE_COMMIT:-NOT_RETURNED}"
            echo "- Health endpoint HTTP status: $STATUS"
            echo "- Database status from live health payload: $(jq -r '.database // "NOT_RETURNED"' "$BODY_FILE" 2>/dev/null || echo NOT_RETURNED)"
            echo
            echo "## Application environment values set in Render Blueprint"
            echo "- ALLOW_NO_DATABASE=true (demo smoke-test mode; permits health HTTP 200 without MongoDB)"
            echo "- MONGODB_DB=clinicdesk"
            echo "- MONGODB_URI is a non-synced secret variable that must be configured in Render; secret value excluded. Live database state: $(jq -r '.database // "NOT_RETURNED"' "$BODY_FILE" 2>/dev/null || echo NOT_RETURNED)"
            echo "- CORS_ORIGIN=not set in the committed Blueprint; application fallback behavior applies unless a dashboard override exists"
            echo
            echo "## Render runtime metadata observed through the live /health response"
            echo "- RENDER=true (runtime metadata block returned)"
            echo "- RENDER_SERVICE_NAME=${SERVICE_NAME:-NOT_RETURNED}"
            echo "- RENDER_SERVICE_ID=${SERVICE_ID:-NOT_RETURNED}"
            echo "- RENDER_EXTERNAL_URL=${LIVE_URL:-$BASE_URL}"
            echo "- RENDER_GIT_BRANCH=${LIVE_BRANCH:-NOT_RETURNED}"
            echo "- RENDER_GIT_COMMIT=${LIVE_COMMIT:-NOT_RETURNED}"
            echo
            echo "Secrets are not included. Exact provider deploy-event ID and event start/finish times must be obtained from Render Events if the rubric requires them; the real running commit SHA and successful verification timestamp are recorded above."
          } > evidence/host-environment.md

          {
            echo "# Container Image Build and Push Record"
            echo
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Source commit used for CI image build: $GITHUB_SHA"
            echo "- Image tag: $IMAGE_REF"
            echo "- Image digest reported by build-push action: ${IMAGE_DIGEST:-NOT_RETURNED}"
            echo "- Registry: GitHub Container Registry (ghcr.io)"
            echo "- Docker build started (UTC): ${IMAGE_BUILD_STARTED_AT:-NOT_RETURNED}"
            echo "- Docker build completed (UTC): ${IMAGE_BUILD_COMPLETED_AT:-NOT_RETURNED}"
            echo "- Registry push started (UTC): ${IMAGE_PUSH_STARTED_AT:-NOT_RETURNED}"
            echo "- Registry push completed (UTC): ${IMAGE_PUSH_COMPLETED_AT:-NOT_RETURNED}"
            echo "- Important: the running Render service is Blueprint-managed with runtime=docker, so it builds from the repository Dockerfile. The GHCR image above is a separately published CI artifact; it is not claimed to be the image pulled by the existing Render service."
            echo
            echo "Secrets are excluded."
          } > evidence/image-push.md

          TASK_DIR="MEAN/module-22-dockerization-production-cloud/task-03-deploy-to-the-cloud-and-commit-the"
          mkdir -p "$TASK_DIR/docs" "$TASK_DIR/evidence" "$TASK_DIR/server/test"

          cat > "$TASK_DIR/docs/deployment.md" <<EOF
          # Step-by-Step Cloud Deployment Log — Week 22 Task 03

          ## Deployment target
          - Provider: Render
          - Service type: Docker Web Service
          - Service name: $SERVICE_NAME
          - Service ID: $SERVICE_ID
          - Public URL: ${LIVE_URL:-$BASE_URL}
          - Health endpoint: $URL
          - Region declared by Blueprint: Oregon (oregon)
          - Repository: https://github.com/$GITHUB_REPOSITORY
          - Branch: main

          ## 1. Build and validate the application
          - Dependency installation started (UTC): ${DEPENDENCIES_STARTED_AT:-NOT_RECORDED}
          - Dependency installation completed (UTC): ${DEPENDENCIES_COMPLETED_AT:-NOT_RECORDED}
          - API tests started (UTC): ${API_TESTS_STARTED_AT:-NOT_RECORDED}
          - API tests completed (UTC): ${API_TESTS_COMPLETED_AT:-NOT_RECORDED}
          - The GitHub Actions workflow installed the API dependencies in server/ and ran the Node HTTP tests.
          - Test command: npm test (working directory: server).
          - Docker build context: server/.
          - Dockerfile: server/Dockerfile.
          - Result in this workflow run: API tests passed and the Docker image build completed successfully.
          - Build/run details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          ## 2. Push the versioned container image
          - Docker build started (UTC): ${IMAGE_BUILD_STARTED_AT:-NOT_RECORDED}
          - Docker build completed (UTC): ${IMAGE_BUILD_COMPLETED_AT:-NOT_RECORDED}
          - Registry push started (UTC): ${IMAGE_PUSH_STARTED_AT:-NOT_RECORDED}
          - Registry push completed (UTC): ${IMAGE_PUSH_COMPLETED_AT:-NOT_RECORDED}
          - Registry: GitHub Container Registry (ghcr.io).
          - Pushed image reference: $IMAGE_REF
          - Image digest: ${IMAGE_DIGEST:-NOT_RETURNED}
          - The GHCR publish step completed successfully in the linked workflow run.
          - Deployment relationship: the existing Render service is configured with runtime=docker in render.yaml. Render builds from the repository's Dockerfile; this log does not falsely claim that Render pulled the separate GHCR image.

          ## 3. Provision the cloud service
          - Provisioned service state/identity verified (UTC): $PROVISION_STATE_OBSERVED_AT. This is when the live service was confirmed by the health endpoint, not a fabricated historical create-event time.
          - Render Blueprint: repository-root render.yaml.
          - Render created the web service clinicdesk-api-demo.
          - Service ID observed from the live health payload: $SERVICE_ID.
          - Blueprint-selected runtime: Docker Web Service.
          - Blueprint-selected region: Oregon (oregon).
          - Render dashboard showed the service as Live; the supplied Deploys screenshot showed a 30.2 second duration for the deployment row running commit 9c647cc.

          ## 4. Configure host environment
          - Blueprint and returned host-configuration values audited (UTC): $HOST_CONFIG_AUDIT_AT.
          - ALLOW_NO_DATABASE=true was configured by render.yaml for a database-free smoke deployment.
          - MONGODB_DB=clinicdesk was configured by render.yaml.
          - MONGODB_URI is declared as a non-synced Render secret (sync: false). Configure a real Atlas connection string in the Render dashboard; its value is never committed or logged.
          - Live database state observed during this run: $(jq -r '.database // "NOT_RETURNED"' "$BODY_FILE" 2>/dev/null || echo NOT_RETURNED).
          - CORS_ORIGIN is not set in the committed Blueprint; any independent dashboard override is not inferred.
          - No secret values are written to source control or this log.

          ## 5. Deploy the application
          - Active deployed revision and branch observed (UTC): $DEPLOYED_REVISION_OBSERVED_AT.
          - Render deployed the Git source revision reported by the running service: $LIVE_COMMIT.
          - The deployed branch reported by Render: $LIVE_BRANCH.
          - Render service public URL: ${LIVE_URL:-$BASE_URL}.
          - Render's current configuration builds from server/Dockerfile on the selected Git commit. The GHCR image above is retained as a versioned CI artifact, not misidentified as the active Render image.
          - The exact provider deployment event start/finish times are not exposed by the public health endpoint. Use the Render Deploys/Events panel for provider-specific event timestamps if the evaluator requires them.

          ## 6. Verify the live deployment
          - Verification completed (UTC): $CHECKED_AT
          - Endpoint requested: $URL
          - HTTP response status: $STATUS
          - Health verification result: $RESULT
          - Response body and Render identity metadata: ../evidence/health-check.txt
          - Host/service environment record: ../evidence/host-environment.md
          - Deployment evidence: ../evidence/deployment.md
          - Verification workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          ## Result and qualification
          The live API returned HTTP $STATUS and supplied Render service identity, branch, and deployed commit metadata at $CHECKED_AT. The app is in database-free smoke-test mode (database not_configured); this confirms API reachability, not MongoDB connectivity. The API source in this repository is a minimal deployment demo, not the original full ClinicDesk MEAN application.
          EOF

          cp evidence/deployment.md "$TASK_DIR/evidence/deployment.md"
          cp evidence/health-check.txt "$TASK_DIR/evidence/health-check.txt"
          cp evidence/host-environment.md "$TASK_DIR/evidence/host-environment.md"
          cp evidence/image-push.md "$TASK_DIR/evidence/image-push.md"
          cp render.yaml "$TASK_DIR/render.yaml"
          cp server/Dockerfile "$TASK_DIR/server/Dockerfile"
          cp server/.dockerignore "$TASK_DIR/server/.dockerignore"
          cp server/index.js "$TASK_DIR/server/index.js"
          cp server/package.json "$TASK_DIR/server/package.json"
          cp server/test/health.test.js "$TASK_DIR/server/test/health.test.js"
          cp server/.dockerignore "$TASK_DIR/.dockerignore"
          cp .dockerignore "$TASK_DIR/repository-root.dockerignore"
          cp server/package.json "$TASK_DIR/package.json"

          # Make the task folder self-contained as well as preserving the original server/ layout.
          cp server/Dockerfile "$TASK_DIR/Dockerfile"
          cp server/index.js "$TASK_DIR/index.js"
          mkdir -p "$TASK_DIR/test" "$TASK_DIR/scripts"
          cp server/test/health.test.js "$TASK_DIR/test/health.test.js"

          cat > "$TASK_DIR/package.json" <<'PKG'
          {
            "name": "clinicdesk-week22-task03-deployment",
            "version": "1.0.0",
            "private": true,
            "main": "index.js",
            "scripts": {
              "start": "node index.js",
              "test": "node --test",
              "check-evidence": "node scripts/generate-deployment-md.js",
              "capture-health": "sh scripts/ci-capture.sh"
            },
            "dependencies": {
              "cors": "^2.8.5",
              "express": "^4.21.2",
              "mongodb": "^6.12.0"
            }
          }
          PKG

          cat > "$TASK_DIR/capture-evidence.yml" <<EOF
          provider: "Render"
          service_type: "Docker Web Service"
          service_name: "$SERVICE_NAME"
          service_id: "$SERVICE_ID"
          region: "Oregon"
          public_url: "${LIVE_URL:-$BASE_URL}"
          health_endpoint: "$URL"
          deployed_branch: "$LIVE_BRANCH"
          deployed_commit_sha: "$LIVE_COMMIT"
          verification_commit_sha: "$GITHUB_SHA"
          health_check_time_utc: "$CHECKED_AT"
          stage_timestamps_utc:
            dependency_install_started: "${DEPENDENCIES_STARTED_AT:-NOT_RECORDED}"
            dependency_install_completed: "${DEPENDENCIES_COMPLETED_AT:-NOT_RECORDED}"
            api_tests_started: "${API_TESTS_STARTED_AT:-NOT_RECORDED}"
            api_tests_completed: "${API_TESTS_COMPLETED_AT:-NOT_RECORDED}"
            image_build_started: "${IMAGE_BUILD_STARTED_AT:-NOT_RECORDED}"
            image_build_completed: "${IMAGE_BUILD_COMPLETED_AT:-NOT_RECORDED}"
            image_push_started: "${IMAGE_PUSH_STARTED_AT:-NOT_RECORDED}"
            image_push_completed: "${IMAGE_PUSH_COMPLETED_AT:-NOT_RECORDED}"
            provision_state_verified: "$PROVISION_STATE_OBSERVED_AT"
            host_configuration_audited: "$HOST_CONFIG_AUDIT_AT"
            deployed_revision_observed: "$DEPLOYED_REVISION_OBSERVED_AT"
            live_health_verification_completed: "$CHECKED_AT"
          http_status: "$STATUS"
          health_result: "$RESULT"
          ci_run_url: "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          registry: "GitHub Container Registry (ghcr.io)"
          image_reference: "$IMAGE_REF"
          image_digest: "${IMAGE_DIGEST:-NOT_RETURNED}"
          render_image_source: "Blueprint runtime=docker builds from repository Dockerfile; GHCR image is a separately published CI artifact."
          environment:
            ALLOW_NO_DATABASE: "true"
            MONGODB_DB: "clinicdesk"
            MONGODB_URI: "not configured; no secret value committed"
            CORS_ORIGIN: "not set in committed Blueprint"
          database_state: "$(jq -r '.database // "NOT_RETURNED"' "$BODY_FILE" 2>/dev/null || echo NOT_RETURNED)"
          deployment_event:
            render_event_id: "Not available from public health response; verify in Render Events if required"
            timestamp: "health verification time is recorded above; this is not the provider deploy-event timestamp"
          EOF

          cat > "$TASK_DIR/deployment-run.log" <<EOF
          ClinicDesk Week 22 Task 03 — Deployment Execution Log
          Repository: https://github.com/$GITHUB_REPOSITORY
          Branch: main
          GitHub Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Log generated at (UTC): $CHECKED_AT

          STEP 1 — BUILD AND TEST
          - Dependency install start (UTC): ${DEPENDENCIES_STARTED_AT:-NOT_RECORDED}
          - Dependency install finish (UTC): ${DEPENDENCIES_COMPLETED_AT:-NOT_RECORDED}
          - API test start (UTC): ${API_TESTS_STARTED_AT:-NOT_RECORDED}
          - API test finish (UTC): ${API_TESTS_COMPLETED_AT:-NOT_RECORDED}
          - Dependencies installed from server/package.json.
          - API test command: npm test (working directory server/).
          - API tests: passed in this run.
          - Docker image build: succeeded in this run.

          STEP 2 — PUSH VERSIONED IMAGE
          - Docker build start (UTC): ${IMAGE_BUILD_STARTED_AT:-NOT_RECORDED}
          - Docker build finish (UTC): ${IMAGE_BUILD_COMPLETED_AT:-NOT_RECORDED}
          - Registry push start (UTC): ${IMAGE_PUSH_STARTED_AT:-NOT_RECORDED}
          - Registry push finish (UTC): ${IMAGE_PUSH_COMPLETED_AT:-NOT_RECORDED}
          - Image reference: $IMAGE_REF
          - Image digest: ${IMAGE_DIGEST:-NOT_RETURNED}
          - Registry push: GitHub Container Registry (ghcr.io), completed successfully in this run.
          - Note: this GHCR image is a versioned CI artifact. The current Render service uses runtime=docker and builds from repository source; the log does not claim Render pulled the GHCR image.

          STEP 3 — PROVISION SERVICE
          - Live service existence/identity confirmed (UTC): $PROVISION_STATE_OBSERVED_AT.
          - Provider: Render.
          - Blueprint resource: clinicdesk-api-demo.
          - Service ID: $SERVICE_ID.
          - Type: Docker Web Service.
          - Blueprint region: Oregon (oregon).
          - Dashboard state observed: Live.
          - Deploys screen provided for this service showed a 30.2-second duration on the deployed commit 9c647cc.

          STEP 4 — CONFIGURE HOST ENVIRONMENT
          - Blueprint/host environment values audited (UTC): $HOST_CONFIG_AUDIT_AT.
          - ALLOW_NO_DATABASE=true (database-free smoke mode, set by root render.yaml).
          - MONGODB_DB=clinicdesk (set by root render.yaml).
          - MONGODB_URI is declared in render.yaml with sync: false and must be configured as a secret in the Render dashboard. Live database state: $FINAL_DATABASE_STATE. $MONGO_URI_STATUS.
          - CORS_ORIGIN is not set in the committed Blueprint. Independent dashboard overrides are not inferred.
          - No secret values are recorded.

          STEP 5 — DEPLOY
          - Running deployment revision observed (UTC): $DEPLOYED_REVISION_OBSERVED_AT.
          - Live public URL: ${LIVE_URL:-$BASE_URL}
          - Active deployed source branch: $LIVE_BRANCH.
          - Active deployed commit SHA: $LIVE_COMMIT.
          - Render's current Blueprint runtime builds from server/Dockerfile on that source revision.
          - Provider-specific deploy-event ID and exact event start/finish timestamps are not returned by /health. The health-check time below is the timestamp of verification, not mislabelled as the deploy event time.

          STEP 6 — VERIFY LIVE SERVICE
          - Check completion time (UTC): $CHECKED_AT.
          - Request: $URL
          - HTTP status: $STATUS.
          - Result: $RESULT.
          - Exact response body is in evidence/health-check.txt.
          - Service environment and identity is in evidence/host-environment.md.
          EOF
          cp "$TASK_DIR/docs/deployment.md" "$TASK_DIR/deployment.md"

          cat > "$TASK_DIR/README.md" <<'README'
          # Week 22 Task 03 — Deploy to the Cloud and Commit the Evidence

          This folder contains the step-by-step deployment log, verified health-check response, service identity, host environment record, versioned image push record, source and test files, and Render configuration snapshot.

          ## Key files
          - docs/deployment.md: ordered build, push, provision, configure, deploy, and live verification log.
          - deployment.md: root-level compatibility copy of the deployment log.
          - deployment-run.log: execution record for the linked workflow run.
          - capture-evidence.yml: non-secret host, image, and runtime environment values.
          - evidence/health-check.txt: actual live HTTP response and UTC check time.
          - evidence/deployment.md: deployment identity, status, public URL, and response.
          - evidence/host-environment.md: provider, service, region and safe environment values.
          - evidence/image-push.md: image tag, digest and registry push evidence.
          - render.yaml: snapshot of the live source-based Blueprint.
          - server/ and root-level Dockerfile/index.js/package.json/test/: source and test code.

          ## Important deployment distinctions
          The live Render service is Blueprint-managed with runtime=docker and builds from repository source. GitHub Actions separately publishes a versioned CI image to GHCR; this package does not claim that Render pulled that image. The active deployment identity is the full commit SHA reported by Render's live /health endpoint.

          The running service uses ALLOW_NO_DATABASE=true for a smoke deployment. HTTP 200 confirms API reachability, but database state remains not_configured; it does not prove MongoDB connectivity. Secrets are not committed.

          To run local checks from this folder: npm install, npm test, npm run check-evidence. The health-capture helper makes a real HTTP request only when supplied with a real BACKEND_URL.
          README

          cat > "$TASK_DIR/scripts/ci-capture.sh" <<'SH'
          #!/usr/bin/env sh
          set -eu
          : "${BACKEND_URL:?Set BACKEND_URL to the real deployed backend base URL}"
          HEALTH_PATH="${HEALTH_PATH:-/health}"
          OUT="${OUTPUT_FILE:-evidence/health-check.txt}"
          CHECKED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          URL="${BACKEND_URL%/}${HEALTH_PATH}"
          mkdir -p "$(dirname "$OUT")"
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT
          STATUS="$(curl --silent --show-error --output "$BODY" --write-out '%{http_code}' --max-time 30 "$URL")"
          {
            echo "Checked at (UTC): $CHECKED_AT"
            echo "URL: $URL"
            echo "HTTP status: $STATUS"
            echo "Response body:"
            cat "$BODY"
            echo
          } > "$OUT"
          cat "$OUT"
          case "$STATUS" in 2*) ;; *) exit 1 ;; esac
          SH

          cat > "$TASK_DIR/scripts/generate-deployment-md.js" <<'JS'
          const fs = require("node:fs");
          const required = [
            "docs/deployment.md",
            "deployment.md",
            "deployment-run.log",
            "capture-evidence.yml",
            "evidence/deployment.md",
            "evidence/health-check.txt",
            "evidence/host-environment.md",
            "evidence/image-push.md"
          ];
          const missing = required.filter((path) => !fs.existsSync(path));
          if (missing.length) {
            console.error("Missing task evidence files:", missing.join(", "));
            process.exit(1);
          }
          const health = fs.readFileSync("evidence/health-check.txt", "utf8");
          const doc = fs.readFileSync("docs/deployment.md", "utf8");
          const requiredStages = ["Build", "Push", "Provision", "Configure", "Deploy", "Verify"];
          const missingStages = requiredStages.filter((stage) => !doc.toLowerCase().includes(stage.toLowerCase()));
          if (missingStages.length) {
            console.error("Missing deployment stages:", missingStages.join(", "));
            process.exit(2);
          }
          if (!/HTTP status: 200/.test(health) || !/Verification result: VERIFIED/.test(health)) {
            console.error("The last captured live health response is not a verified HTTP 200.");
            process.exit(3);
          }
          console.log("Required deployment log and evidence files are present; health evidence is a verified HTTP 200 response.");
          JS

          # Preserve the exact generated files for a retry-safe evidence commit.
          tar -czf "$RUNNER_TEMP/deployment-evidence-payload.tar.gz" evidence MEAN/module-22-dockerization-production-cloud/task-03-deploy-to-the-cloud-and-commit-the/

          {
            echo "## Live deployment verification"
            echo "- Result: **$RESULT**"
            echo "- URL: ${LIVE_URL:-$BASE_URL}"
            echo "- Checked (UTC): $CHECKED_AT"
            echo "- HTTP status: $STATUS"
            echo "- Render deployed commit: ${LIVE_COMMIT:-NOT_RETURNED}"
            echo "- Note: $REASON"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          echo "evidence_written=true" >> "$GITHUB_OUTPUT"

      - name: Validate AxReview task-folder evidence
        if: ${{ steps.healthcheck.outputs.evidence_written == 'true' }}
        working-directory: MEAN/module-22-dockerization-production-cloud/task-03-deploy-to-the-cloud-and-commit-the
        run: node scripts/generate-deployment-md.js

      - name: Commit live deployment evidence (retry-safe)
        if: ${{ always() && steps.healthcheck.outputs.evidence_written == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          PAYLOAD="$RUNNER_TEMP/deployment-evidence-payload.tar.gz"
          test -f "$PAYLOAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Evidence commit attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main
            tar -xzf "$PAYLOAD" -C "$GITHUB_WORKSPACE"
            git add evidence/health-check.txt evidence/deployment.md evidence/host-environment.md evidence/image-push.md MEAN/module-22-dockerization-production-cloud/task-03-deploy-to-the-cloud-and-commit-the/
            if git diff --cached --quiet; then
              echo "Evidence is already up to date."
              exit 0
            fi
            git commit -m "docs: record live Render deployment health evidence"
            if git push origin HEAD:main; then
              echo "Deployment evidence committed."
              exit 0
            fi
            echo "Remote main changed during push; reloading latest main and retrying."
          done
          echo "Failed to commit evidence after 5 retries."
          exit 1

      - name: Fail deployment verification when live health check is not successful
        if: ${{ steps.healthcheck.outputs.evidence_written == 'true' && steps.healthcheck.outputs.verified != 'true' }}
        run: |
          echo "Live deployment verification failed. Actual response and diagnosis were committed to evidence/."
          exit 1
