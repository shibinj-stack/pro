<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClinicDesk Demo</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:3rem auto;padding:0 1rem;color:#182230}
    .card{border:1px solid #d0d7de;border-radius:12px;padding:1.25rem;margin:1rem 0}
    input{width:min(100%,540px);padding:.7rem;border:1px solid #98a2b3;border-radius:8px}
    button{padding:.7rem 1rem;border:0;border-radius:8px;background:#155eef;color:white;cursor:pointer}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4f7;padding:1rem;border-radius:8px}
  </style>
</head>
<body>
  <h1>ClinicDesk</h1>
  <p>Minimal deployment demo UI. Set the deployed API URL below.</p>
  <div class="card">
    <label for="api">Backend URL</label><br>
    <input id="api" placeholder="https://your-service.onrender.com">
    <button id="check">Check health</button>
    <pre id="result">No health request made yet.</pre>
  </div>
  <script>
    const input=document.querySelector('#api');
    const result=document.querySelector('#result');
    input.value=localStorage.getItem('clinicdesk-api')||'';
    document.querySelector('#check').addEventListener('click',async()=>{
      const base=input.value.trim().replace(/\/$/,'');
      localStorage.setItem('clinicdesk-api',base);
      result.textContent='Requesting…';
      try{
        const response=await fetch(base+'/health');
        const body=await response.text();
        result.textContent='HTTP '+response.status+'\n'+body;
      }catch(e){result.textContent='Request failed: '+e.message;}
    });
  </script>
</body>
</html>
